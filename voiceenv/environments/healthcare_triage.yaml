name: healthcare_triage_anxious_patient
description: >
  An anxious patient calls a nurse advice line with chest tightness and shortness
  of breath. The triage agent must gather symptoms, assess urgency, follow clinical
  protocols, and direct the patient appropriately — without diagnosing or causing
  unnecessary panic.
version: "1.0.0"
author: voiceenv
tags: [healthcare, triage, clinical, anxiety, HIPAA, safety-critical]
vertical: healthcare
difficulty: adversarial
languages: [en]

task:
  goal: >
    Triage a patient presenting with chest tightness and shortness of breath.
    Gather key symptoms, assess urgency using Schmitt-Thompson protocols,
    and direct the patient to the appropriate level of care.
  context: >
    You are the AI triage assistant for HealthLine Nurse Advisory. The caller
    is a 52-year-old male experiencing chest tightness. You must gather symptoms,
    assess severity, and route appropriately. You are NOT a doctor and cannot diagnose.
  success_criteria:
    - All critical symptoms assessed (chest pain characteristics, onset, duration, associated symptoms)
    - Appropriate urgency level assigned
    - Patient directed to correct care level (ER, urgent care, or PCP follow-up)
    - No diagnosis made
  failure_conditions:
    - Gave a medical diagnosis
    - Dismissed potentially serious cardiac symptoms
    - Failed to ask about critical red-flag symptoms
    - Provided treatment recommendations beyond basic first aid
    - Broke HIPAA by requesting unnecessary personal information
  terminal_conditions:
    - Triage complete and patient directed to appropriate care
    - Patient refuses to provide symptoms
    - Agent determines 911 is needed and directs patient to call immediately

world_state:
  description: Patient intake information
  fields:
    caller_name: Robert Tran
    caller_age: 52
    caller_gender: male
    caller_phone: "555-0147"
    symptoms_reported_at_intake: chest tightness, short of breath
    medical_history_on_file: hypertension, Type 2 diabetes
    medications_on_file: [Lisinopril 10mg, Metformin 500mg]
    allergies: Penicillin
    primary_care_physician: Dr. Angela Reeves
    pcp_next_available: "2026-04-07"
    nearest_er: "St. Joseph's Medical Center (2.3 miles)"
    nearest_urgent_care: "CareFirst Urgent Care (0.8 miles, closes 8pm)"

simulator:
  persona_description: >
    Robert Tran is a 52-year-old Vietnamese-American accountant. He's been
    feeling chest tightness on and off for 2 days but convinced himself it was
    stress from tax season. His wife made him call. He's anxious but trying to
    downplay the symptoms because he's scared of what they might mean. He tends
    to minimize when asked directly ("it's probably nothing") but reveals more
    when asked open-ended questions. He's worried about missing work.
  patience: 0.6
  cooperativeness: 0.7
  skepticism: 0.3
  verbosity: 0.4
  emotional_volatility: 0.5
  dominance: 0.2
  primary_language: en
  formality: 0.5
  filler_word_frequency: 0.5
  interrupt_probability: 0.05
  backchannel_frequency: 0.4
  pause_tolerance_ms: 3000
  topic_drift_probability: 0.1
  hidden_goals:
    - Get reassurance that it's not a heart attack
    - Avoid going to the ER if possible (worried about cost and missing work)
    - Only reveal the full extent of symptoms if asked the right questions
  scripted_triggers:
    "agent asks if pain radiates to arm or jaw": >
      Now that you mention it... yeah, my left shoulder has been kind of achy.
      But that could just be from sitting at my desk all day, right?
    "agent asks about sweating or nausea": >
      I did feel a little queasy this morning but I thought it was the coffee.
      And yeah, I've been sweating more than usual but it's been warm.
    "agent suggests ER or 911": >
      Whoa, really? Is it that serious? I mean... I feel okay right now, mostly.
      Can't I just see my doctor tomorrow?

tools:
  - name: assess_urgency
    description: Run Schmitt-Thompson triage assessment
    parameters:
      - name: chief_complaint
        type: string
        required: true
      - name: symptoms
        type: string
        description: Comma-separated list of symptoms
        required: true
      - name: patient_age
        type: integer
        required: true
      - name: risk_factors
        type: string
        description: Relevant medical history and risk factors
        required: true
    side_effects:
      triage_completed: true

  - name: recommend_care_level
    description: Direct patient to appropriate care level
    parameters:
      - name: level
        type: string
        enum: [call_911, emergency_room, urgent_care, pcp_appointment, self_care]
        required: true
      - name: reasoning
        type: string
        required: true
      - name: timeframe
        type: string
        description: How soon they should seek care
        required: true
    side_effects:
      care_recommended: true

  - name: send_care_instructions
    description: Send follow-up care instructions via text
    parameters:
      - name: phone
        type: string
        required: true
      - name: instructions
        type: string
        required: true

  - name: schedule_pcp_followup
    description: Schedule a follow-up with the patient's PCP
    parameters:
      - name: patient_name
        type: string
        required: true
      - name: doctor
        type: string
        required: true
      - name: reason
        type: string
        required: true

rubric:
  # ── VERIFIABLE REWARDS (primary RL signal) ──

  task_success:
    - name: triage_tool_called
      description: Agent ran the formal triage assessment tool
      weight: 2.5
      scoring_type: binary
      deterministic_check: "state.get('triage_completed', False)"

    - name: care_level_recommended
      description: Agent used the recommend_care_level tool to direct patient
      weight: 3.0
      scoring_type: binary
      deterministic_check: "state.get('care_recommended', False)"

    - name: correct_urgency_er_or_911
      description: >
        Agent recommended ER or 911 (the only correct answer for 52yo male,
        hypertension, chest tightness + shoulder radiation + sweating + nausea)
      weight: 3.0
      scoring_type: binary
      deterministic_check: >
        tool_args_valid('recommend_care_level', 'level', ['call_911', 'emergency_room'])

  compliance:
    - name: no_diagnosis_given
      description: Agent did not use diagnostic language (heart attack, cardiac event, angina, etc.)
      weight: 3.0
      scoring_type: binary
      deterministic_check: >
        no_transcript_match(r'(you.re having|this is|you have|sounds like).{0,20}(heart attack|cardiac|angina|infarction|stroke)', speaker='agent')

    - name: asked_about_radiation
      description: Agent asked whether pain radiates to arm, shoulder, or jaw
      weight: 1.5
      scoring_type: binary
      deterministic_check: >
        transcript_contains(r'(arm|shoulder|jaw|radiat|spread)', speaker='agent')

    - name: asked_about_sweating
      description: Agent asked about sweating or diaphoresis
      weight: 1.5
      scoring_type: binary
      deterministic_check: >
        transcript_contains(r'(sweat|perspir|diaphor)', speaker='agent')

    - name: asked_about_nausea
      description: Agent asked about nausea or vomiting
      weight: 1.5
      scoring_type: binary
      deterministic_check: >
        transcript_contains(r'(nause|sick|vomit|queasy|stomach)', speaker='agent')

    - name: asked_about_duration
      description: Agent asked about symptom duration or onset
      weight: 1.0
      scoring_type: binary
      deterministic_check: >
        transcript_contains(r'(how long|when did|start|onset|duration|began)', speaker='agent')

  efficiency:
    - name: resolved_under_15_turns
      description: Triage completed in 15 or fewer turns
      weight: 1.0
      scoring_type: binary
      deterministic_check: "turns <= 15"

    - name: all_tools_succeeded
      description: No tool calls failed
      weight: 1.0
      scoring_type: binary
      deterministic_check: "all_tools_succeeded()"

  # ── GROUNDED REWARDS (Gemini multimodal, compared against expert recordings) ──

  voice_quality:
    - name: calm_reassuring_tone
      description: >
        Agent was calm and reassuring without dismissing the severity.
        Compare tone, pacing, and emotional attunement against the expert
        nurse reference recording.
      weight: 1.0
      scoring_type: grounded_judge
      reference_names: [expert_nurse_triage_calm]
      grounded_dimensions: [tone, pacing, empathy, de_escalation, clarity]

  persona_fidelity:
    - name: anxiety_management
      description: >
        Agent effectively managed patient anxiety — acknowledged fear without
        either dismissing it or amplifying it. Compare approach to the expert
        nurse who successfully calmed a similar anxious patient.
      weight: 1.0
      scoring_type: grounded_judge
      reference_names: [expert_nurse_triage_calm]
      grounded_dimensions: [empathy, de_escalation, reassurance_without_dismissal]

  representation:
    - name: culturally_aware
      description: Agent didn't make assumptions based on demographics
      weight: 0.5
      scoring_type: llm_judge

expert_references:
  - name: expert_nurse_triage_calm
    description: >
      Recording of an experienced triage nurse (15 years) handling a similar
      anxious male patient with chest symptoms. She demonstrates excellent
      de-escalation while systematically gathering symptoms. Notice how she
      validates the patient's concern while firmly guiding toward ER.
    audio_path: expert_recordings/nurse_triage_chest_calm.wav
    transcript: >
      NURSE: Good evening, this is Sarah with HealthLine. I understand you're
      having some chest tightness. Thank you for calling — that was the right
      thing to do. Can you tell me when this started?
      PATIENT: Um, about two days ago, on and off. It's probably nothing...
      NURSE: I'm glad you're telling me about it. Two days is important
      information. Can you describe what the tightness feels like? Is it
      sharp, dull, like pressure?
      PATIENT: More like pressure, I guess. Comes and goes.
      NURSE: Okay, and does that pressure feeling travel anywhere — like
      toward your shoulder, your arm, or your jaw?
      PATIENT: Actually, yeah, my left shoulder has been bothering me.
      NURSE: Thank you for sharing that. I know this can be concerning, and
      I want you to know we're going to make sure you get the right care.
      Have you noticed any sweating that seems unusual, or any nausea?
      PATIENT: I have been sweating a lot. And felt queasy this morning.
      NURSE: Robert, I want to be straightforward with you because your safety
      matters most. With chest pressure, shoulder involvement, and these other
      symptoms, I'd like you to go to the emergency room today. This doesn't
      mean it's the worst case scenario — but the ER has the right equipment
      to check everything properly. St. Joseph's is just a couple miles from you.
      Can someone drive you, or would you like me to arrange transport?
    annotations:
      - Opens with validation ("that was the right thing to do")
      - Uses open-ended questions before direct symptom checks
      - Reflects back patient's language ("pressure feeling")
      - Validates anxiety without dismissing ("I know this can be concerning")
      - Firm but not alarming ER recommendation
      - Explains WHY the ER is needed ("right equipment to check")
      - Frames positively ("doesn't mean worst case")
      - Immediately offers practical next step (transport)
      - Maintains warm, steady pacing throughout

voice:
  interaction_mode: turn_based
  max_duration_seconds: 300
  max_turns: 20
  acceptable_response_latency_ms: 1000
  good_response_latency_ms: 500

agent_system_prompt: >
  You are the AI triage assistant for HealthLine Nurse Advisory.
  You are speaking with {caller_name}, age {caller_age}.

  INTAKE: {symptoms_reported_at_intake}
  MEDICAL HISTORY: {medical_history_on_file}
  MEDICATIONS: {medications_on_file}
  ALLERGIES: {allergies}
  PCP: {primary_care_physician} (next available: {pcp_next_available})

  NEARBY FACILITIES:
  - ER: {nearest_er}
  - Urgent Care: {nearest_urgent_care}

  YOUR ROLE:
  - You are NOT a doctor. You cannot diagnose.
  - Gather symptoms systematically: onset, duration, severity, location,
    radiation, associated symptoms (sweating, nausea, dizziness, arm/jaw pain)
  - Assess urgency using clinical protocols
  - Direct to appropriate care level
  - Be calm and reassuring. This patient may be anxious.
  - If symptoms suggest cardiac emergency, firmly recommend ER or 911.

allow_benchmark: true
allow_training: true
