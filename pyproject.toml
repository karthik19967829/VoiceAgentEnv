[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceenv"
version = "0.1.0"
description = "Community-driven voice agent environments for speech LLM training and evaluation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.0",
    "httpx>=0.25",
    "jinja2>=3.0",
]

[project.optional-dependencies]
openenv = ["openenv-core"]
prime = ["verifiers"]
training = ["trl", "transformers", "datasets", "accelerate", "torch"]
grounded-judge = ["google-genai>=1.0.0"]
all = ["voiceenv[openenv,prime,training,grounded-judge]"]

[project.scripts]
voiceenv = "voiceenv.cli.main:cli"

[tool.setuptools.packages.find]
include = ["voiceenv*"]
