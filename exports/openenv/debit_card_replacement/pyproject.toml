[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debit_card_replacement"
version = "1.0.0"
description = "A call for replacing a lost debit card."
requires-python = ">=3.10"
dependencies = [
    "openenv-core",
    "voiceenv",
    "openai>=1.0",
    "pyyaml>=6.0",
]